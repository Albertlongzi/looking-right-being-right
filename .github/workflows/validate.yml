name: Validate Scene Fidelity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check site/page.js
          node --check site/viewer.js
